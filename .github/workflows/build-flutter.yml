name: Build Flutter APK (Fallback Worker)

on:
  workflow_dispatch:
    inputs:
      jobId:
        description: 'Job ID from Bot'
        required: true
        type: string

      userId:
        description: 'User ID'
        required: true
        type: string

      payload:
        description: 'Build Payload (JSON)'
        required: true
        type: string

      worker:
        description: 'Worker label'
        required: false
        default: 'ubuntu-latest'
        type: string

jobs:
  build:
    runs-on: ${{ github.event.inputs.worker }}

    steps:
      # ============================================================
      # CHECKOUT
      # ============================================================
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ============================================================
      # CLEAN RUNNER STORAGE
      # ============================================================
      - name: Free Runner Disk Space
        shell: bash
        run: |
          set +e

          echo "======================================"
          echo "   RUNNER STORAGE BEFORE CLEANUP"
          echo "======================================"

          df -h /

          echo ""
          echo "Cleaning safe temporary/cache directories..."

          rm -rf "$RUNNER_TEMP"/* 2>/dev/null || true

          rm -rf "$HOME/.gradle/caches" 2>/dev/null || true
          rm -rf "$HOME/.gradle/wrapper" 2>/dev/null || true

          rm -rf "$HOME/.pub-cache/_temp" 2>/dev/null || true

          sudo apt-get clean 2>/dev/null || true

          docker system prune -af 2>/dev/null || true

          echo ""
          echo "======================================"
          echo "   RUNNER STORAGE AFTER CLEANUP"
          echo "======================================"

          df -h /

      # ============================================================
      # JAVA
      # ============================================================
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # ============================================================
      # FLUTTER
      # ============================================================
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.0'
          channel: 'stable'

      # ============================================================
      # PREPARE PROJECT
      # ============================================================
      - name: Prepare Project
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

        shell: bash

        run: |
          set -e

          echo '${{ github.event.inputs.payload }}' > payload.json

          echo "Payload:"
          cat payload.json

          ASSET_URL=$(jq -r '.zipAssetUrl // .url // empty' payload.json)

          if [ -z "$ASSET_URL" ]; then
            echo "::error::Tidak ada zipAssetUrl atau url di payload."
            cat payload.json
            exit 1
          fi

          echo ""
          echo "Downloading project source..."

          rm -rf project project.zip
          mkdir -p project

          if [[ "$ASSET_URL" == *"api.github.com"* ]]; then

            curl -fL \
              --retry 3 \
              --retry-delay 2 \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/octet-stream" \
              -o project.zip \
              "$ASSET_URL"

          else

            curl -fL \
              --retry 3 \
              --retry-delay 2 \
              -o project.zip \
              "$ASSET_URL"

          fi

          echo ""
          echo "Extracting project..."

          unzip -q project.zip -d project

          # ZIP tidak dibutuhkan lagi setelah extract
          rm -f project.zip

          PUBSPEC=$(find project \
            -maxdepth 5 \
            -type f \
            -name pubspec.yaml \
            | head -n 1)

          if [ -z "$PUBSPEC" ]; then
            echo "::error::pubspec.yaml tidak ditemukan."
            find project -maxdepth 3
            exit 1
          fi

          PROJECT_ROOT=$(dirname "$PUBSPEC")

          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"

          echo ""
          echo "Detected Flutter project root:"
          echo "$PROJECT_ROOT"

          echo ""
          echo "Storage:"
          df -h /

      # ============================================================
      # BUILD APK
      # ============================================================
      - name: Build APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_ROOT"

          echo "======================================"
          echo "        FLUTTER BUILD"
          echo "======================================"

          flutter clean

          flutter pub get

          echo ""
          echo "Storage before APK build:"
          df -h /

          # --------------------------------------------------------
          # FIRST BUILD
          # --------------------------------------------------------
          set +e

          flutter build apk --release

          BUILD_EXIT=$?

          set -e

          # --------------------------------------------------------
          # ENOSPC RETRY
          # --------------------------------------------------------
          if [ "$BUILD_EXIT" -ne 0 ]; then

            echo ""
            echo "======================================"
            echo "     FIRST BUILD FAILED"
            echo "======================================"

            echo "Exit code: $BUILD_EXIT"

            echo ""
            echo "Checking disk:"
            df -h /

            # Cek apakah log kemungkinan ENOSPC
            if [ "$BUILD_EXIT" -ne 0 ]; then

              echo ""
              echo "Cleaning Flutter/Gradle temporary data..."

              rm -rf "$HOME/.gradle/caches" 2>/dev/null || true
              rm -rf "$HOME/.gradle/wrapper" 2>/dev/null || true
              rm -rf "$HOME/.pub-cache/_temp" 2>/dev/null || true
              rm -rf "$RUNNER_TEMP"/* 2>/dev/null || true

              find "$PROJECT_ROOT" \
                -type d \
                \( -name ".dart_tool" -o -name "build" \) \
                -prune \
                -exec rm -rf {} + 2>/dev/null || true

              echo ""
              echo "Storage after emergency cleanup:"
              df -h /

              echo ""
              echo "Rebuilding project..."

              flutter pub get

              flutter build apk --release

            fi
          fi

          echo ""
          echo "======================================"
          echo "        BUILD SUCCESS"
          echo "======================================"

          df -h /

      # ============================================================
      # LOCATE APK
      # ============================================================
      - name: Locate APK
        shell: bash
        run: |
          set -e

          APK_PATH=$(
            find "$PROJECT_ROOT" \
              -type f \
              -name "app-release.apk" \
              -path "*/flutter-apk/*" \
              | head -n 1
          )

          if [ -z "$APK_PATH" ]; then

            echo "::error::app-release.apk tidak ditemukan setelah build."

            find "$PROJECT_ROOT/build" \
              -maxdepth 5 \
              -type f \
              2>/dev/null || true

            exit 1
          fi

          echo "APK_PATH=$APK_PATH" >> "$GITHUB_ENV"

          echo ""
          echo "APK:"
          echo "$APK_PATH"

          echo ""
          echo "APK size:"
          du -h "$APK_PATH"

      # ============================================================
      # UPLOAD APK
      # ============================================================
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ github.event.inputs.jobId }}
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          retention-days: 1

      # ============================================================
      # FINAL CLEANUP
      # ============================================================
      - name: Cleanup Build Files
        if: always()
        shell: bash
        run: |
          set +e

          echo "Cleaning temporary build files..."

          rm -rf project.zip
          rm -rf "$RUNNER_TEMP"/*

          echo ""
          echo "Final disk usage:"
          df -h /
